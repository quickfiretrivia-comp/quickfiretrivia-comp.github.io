<!DOCTYPE html>
<html>
<head>
    <title>Game Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        #game-frame {
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* --- ADD THIS: Portrait-specific overrides --- */
        @media screen and (orientation: portrait) {
            #game-frame {
                /* In portrait, some games may be taller than the screen.
                   overflow: auto on a fixed iframe won't work, so we
                   switch to absolute positioning to allow natural scroll
                   only if the game content exceeds the viewport height. */
                position: absolute;
                width: 100%;
                height: 100%;
                min-height: 100vh;
            }

            body, html {
                /* Allow vertical scroll only in portrait if game overflows */
                overflow-y: auto;
                overflow-x: hidden;
            }
        }
        /* --- END PORTRAIT OVERRIDES --- */

        #loading-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        #loading-screen p {
            color: #ffffff;
            font-family: sans-serif;
            font-size: 20px;
            letter-spacing: 2px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%   { opacity: 1; }
            50%  { opacity: 0.3; }
            100% { opacity: 1; }
        }

        /* ── Back to Games Pill Button ── */
        #menu-btn {
            position: fixed;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            
            background-color: #000000;
            border: 2px solid #ffd700; /* Gold frame */
            border-radius: 25px;       /* Pill shape */
            
            color: #ffd700;
            font-family: sans-serif;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            
            padding: 8px 18px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            
            /* Hidden by default until the timer triggers it */
            display: none;
        }
        
        #menu-btn:active {
            transform: translateX(-50%) scale(0.95);
            background-color: #1a1a1a;
        }
    </style>
</head>
<body>
    <div id="loading-screen">
        <p>CONNECTING TO SERVERS</p>
    </div>
    <iframe
        id="game-frame"
        src=""
        allowfullscreen
        allow="autoplay; fullscreen; payment"
        scrolling="no"
        frameborder="0">
    </iframe>
    <button id="menu-btn" onclick="exitWebview()">EXIT TO MAIN GAMES MENU</button>
    <script>
        var params = new URLSearchParams(window.location.search);
        var gameId = params.get('id');
        var frame         = document.getElementById('game-frame');
        var loadingScreen = document.getElementById('loading-screen');
        var gameUrl       = gameId ? 'https://html5.gamemonetize.com/' + gameId + '/' : null;

        // ── Godot Bridge Exit Function ──
        function exitWebview() {
          if (window.GodotChrome && window.GodotChrome.postMessage) {
            window.GodotChrome.postMessage(JSON.stringify({ type: "exit_webview" }));
          }
        }
        
        
        
        // ── Timed Visibility Logic ──
        function startMenuButtonTimer() {
            var btn = document.getElementById('menu-btn');
            if (!btn) return;
        
            function showButton() {
                btn.style.display = 'block';
        
                // Hide after 30 seconds
                setTimeout(function() {
                    btn.style.display = 'none';
                }, 30000); // 30 seconds = 30,000 ms
            }
        
            // 1. Initial trigger: Show after 2 minutes (120,000 ms)
            setTimeout(function() {
                showButton();
        
                // 2. Repeating trigger: Show every 10 minutes (600,000 ms)
                setInterval(function() {
                    showButton();
                }, 600000);
        
            }, 120000);
        }

        // Start the timer cycle when page loads
        startMenuButtonTimer();
        if (!gameId) {
            loadingScreen.style.display = 'none';
            document.body.innerHTML = "<h2 style='color:white;text-align:center;margin-top:40%;font-family:sans-serif'>Invalid Game Link</h2>";
        } else {
            frame.addEventListener('load', function () {
                if (navigator.onLine) {
                    loadingScreen.style.display = 'none';
                }
            });

            window.addEventListener('online', function () {
                loadingScreen.style.display = 'flex';
                frame.src = gameUrl;
            });

            // --- ADD THIS: re-fit the iframe on orientation change ---
            window.addEventListener('orientationchange', function () {
                // Small delay lets the browser finish rotating before we resize
                setTimeout(function () {
                    frame.style.width  = window.innerWidth  + 'px';
                    frame.style.height = window.innerHeight + 'px';
                }, 300);
            });
            // --- END ADDITION ---

            if (navigator.onLine) {
                frame.src = gameUrl;
            } else {
                loadingScreen.style.display = 'none';
            }
        }
    </script>
</body>
</html>
